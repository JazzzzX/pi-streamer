# Start sshd only after ssh-setup has enabled it. The packaged "ssh-keygen -A" step is
# dropped: it would try to write host keys to the read-only root filesystem.
[Unit]
Wants=streamer-ssh-setup.service
After=streamer-ssh-setup.service
ConditionPathExists=/run/streamer-ssh/enabled

[Service]
ExecStartPre=
