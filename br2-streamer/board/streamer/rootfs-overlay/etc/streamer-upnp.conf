# Streamer: upmpdcli turns MPD into a UPnP/DLNA network player named "Streamer". Apps
# such as BubbleUPnP find it on the network and send it music.
# OpenHome is off: with both on, upmpdcli announces two devices, and its OpenHome side
# offers a credentials service for streaming services that needs programs this image
# does not have. avfriendlyname: without it the player is called "Streamer-UPnP/AV".
friendlyname = Streamer
avfriendlyname = Streamer
ohproductroom = Streamer
mpdhost = 127.0.0.1
mpdport = 6600
upnpav = 1
openhome = 0
cachedir = /run/streamer-upnp
logfilename = stderr
loglevel = 2
