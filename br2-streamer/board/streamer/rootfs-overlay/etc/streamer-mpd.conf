# Streamer: MPD is the playback engine of the network player (UPnP/DLNA). Phones talk to
# upmpdcli (streamer-upnp.service), which controls MPD over 127.0.0.1 only.
# start-player fills in the DAC's volume control (@MIXER@) and writes the result to /run.
playlist_directory      "/run/streamer-mpd/playlists"
bind_to_address         "127.0.0.1"
port                    "6600"
zeroconf_enabled        "no"
auto_update             "no"

input {
        plugin          "curl"
}

# The DAC is opened directly ("hw"): a stream goes out unchanged when the DAC accepts
# its sample rate and format. Only when it does not, MPD converts, with soxr for rates.
resampler {
        plugin          "soxr"
        quality         "very high"
}

audio_output {
        type            "alsa"
        name            "JM7MAX"
        device          "hw:CARD=JM7MAX"
        mixer_type      "hardware"
        mixer_device    "hw:CARD=JM7MAX"
        mixer_control   "@MIXER@"
}
